# Replace the "backend" object below with the snippet from DecapBridge. We need something here to get the CMS to work locally, but this alone won't work in production
backend:
    name: git-gateway
    branch: main

# Keep this to allow you to edit the cms locally
local_backend: true

# change url to a link to the image you want to use, no file paths, must be a URL
logo_url: https://cristabelhernandez.com/assets/svgs/cristabel-hernandez-logo.svg

# CMS interface language
locale: "es"

# Image folders
media_folder: "src/assets/images/blog"
public_folder: "/assets/images/blog"

# Decap CMS Collections
collections:
    - name: "blog"
      label: "Blog"
      folder: "src/content/blog"
      create: true
      slug: "{{slug}}"
      fields:
          - { label: "Título", name: "title", widget: "string" }
          - {
                label: "Enlace permanente",
                name: "url",
                widget: "string",
                hint: 'Indica la dirección donde quedará la entrada. Si escribes "Mi Entrada", se verá en "blog/mi-entrada"',
            }
          - { label: "Descripción", name: "description", widget: "string" }
          - { label: "Autor", name: "author", widget: "string" }
          - { label: "Fecha", name: "date", widget: "datetime" }
          - { label: "Etiquetas", name: "tags", widget: "list", default: ["post"] }
          - { label: "Imagen destacada", name: "image", widget: "image" }
          - { label: "Pie de imagen", name: "imageAlt", widget: "string" }
          - { label: "Contenido", name: "body", widget: "markdown" }
