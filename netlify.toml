[build]
  publish = "public/"
  command = "npm run build"

# Security headers. No enforced Content-Security-Policy on purpose: the
# site has inline scripts on several pages, the GTM container snippet,
# and the Decap CMS admin (unpkg + Netlify Identity) — an enforced CSP
# needs its own inventory-and-hash pass before it can ship safely.
# COOP uses same-origin-allow-popups so the Netlify Identity login popup
# used by /admin keeps working.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Temporary closure: keep every response out of search results.
    X-Robots-Tag = "noindex, nofollow"

# The closure redirect lives ONLY in src/_redirects (copied to
# public/_redirects). All [[redirects]] were removed from this file so
# there is a single source of redirect rules during the closure.
# The SPA rewrites below were removed for the same reason; they are in
# git history and come back when the site reopens.
# To reopen: empty src/_redirects, restore src/index.html, and restore
# the SPA rewrites from git history.

[[plugins]]
  # Installs the Lighthouse Build Plugin for all deploy contexts
  package = "@netlify/plugin-lighthouse"

[[plugins]]
package = "netlify-plugin-cache"

  [plugins.inputs]
  paths = [
    "public/assets/images", # Processed images - adjust to match your outputDir
    ".cache" # Remote Assets
  ]