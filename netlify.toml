[build]
  publish = "public/"
  command = "npm run build"

# Security headers. No enforced Content-Security-Policy on purpose: the
# site has inline scripts on several pages, the GTM container snippet,
# and the Decap CMS admin (unpkg + Netlify Identity) — an enforced CSP
# needs its own inventory-and-hash pass before it can ship safely.
# COOP uses same-origin-allow-popups so the Netlify Identity login popup
# used by /admin keeps working.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# QR code on the business card (cristabel-qr-code.svg encodes
# https://cristabelhernandez.com/qr). 302, not 301, so the target can
# change later without browsers caching the redirect permanently.
# One hop, straight to the home page. The UTM parameters let GA4
# (already on the site via GTM) attribute the visit to the QR code:
# source = qr_code, medium = print, campaign = business_card. See the
# QR traffic in GA4 under Reports > Acquisition > Traffic acquisition.
[[redirects]]
  from = "/qr"
  to = "/?utm_source=qr_code&utm_medium=print&utm_campaign=business_card"
  status = 302

# Booking app (app/): SPA fallback for the two gated areas only.
# The React app is built into public/app by the root build (build:app).
[[redirects]]
  from = "/mi-cuenta"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/mi-cuenta/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/panel"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/panel/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/reservar"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/reservar/*"
  to = "/app/index.html"
  status = 200

[[plugins]]
  # Installs the Lighthouse Build Plugin for all deploy contexts
  package = "@netlify/plugin-lighthouse"

[[plugins]]
package = "netlify-plugin-cache"

  [plugins.inputs]
  paths = [
    "public/assets/images", # Processed images - adjust to match your outputDir
    ".cache" # Remote Assets
  ]