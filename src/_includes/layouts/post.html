{% extends "layouts/base.html" %}

{% block head %}
    <link rel="preload" as="image" type="image/avif" media="(max-width: 600px)" imagesrcset="{% getUrl image | resize({ width: 576, height: 400 }) | avif({ quality: 70 }) %} 576w, {% getUrl image | resize({ width: 1152, height: 800 }) | avif({ quality: 70 }) %} 1152w" imagesizes="100vw" fetchpriority="high">
    <link rel="preload" as="image" type="image/avif" media="(max-width: 1024px)" imagesrcset="{% getUrl image | resize({ width: 800, height: 307 }) | avif({ quality: 70 }) %} 800w, {% getUrl image | resize({ width: 1600, height: 614 }) | avif({ quality: 70 }) %} 1600w" imagesizes="100vw" fetchpriority="high">
    <link rel="preload" as="image" type="image/avif" media="(min-width: 1024px)" imagesrcset="{% getUrl image | resize({ width: 800, height: 400 }) | avif({ quality: 70 }) %} 800w, {% getUrl image | resize({ width: 1600, height: 800 }) | avif({ quality: 70 }) %} 1600w" imagesizes="800px" fetchpriority="high">
    <link rel="stylesheet" href="/assets/css/blog.css">

    <!-- To ensure proper validation, prevent errors, and encourage developers to check, schema's are an opt-in feature. They're very bespoke and requires some customising  -->
    <!-- Uncomment the code below to enable Structured Data, and test it when you deploy to Netlify - https://developers.google.com/search/docs/appearance/structured-data -->
    <!-- {% include "components/post-schema.html" %} -->
{% endblock %}

{% block body %}
    <!-- ============================================ -->
    <!--                   Banner                     -->
    <!-- ============================================ -->

    <!-- Plain deep-sage band: article pages no longer carry a banner photo
         (the template's demo cabinets image was removed on purpose) -->
    <div id="banner-310">
        <div class="cs-container"></div>
    </div>

    <!-- ============================================ -->
    <!--                Post Content                  -->
    <!-- ============================================ -->

    <div id="single-article">
        <div class="cs-container">
            <article class="cs-article-post">
                <picture class="cs-article-image">
                    <!--Mobile Image-->
                    <source media="(max-width: 600px)" srcset="{% getUrl image | resize({ width: 576, height: 400 }) | avif({ quality: 70 }) %} 576w, {% getUrl image | resize({ width: 1152, height: 800 }) | avif({ quality: 70 }) %} 1152w" type="image/avif" sizes="100vw">
                    <source media="(max-width: 600px)" srcset="{% getUrl image | resize({ width: 576, height: 400 }) | webp({ quality: 78 }) %} 576w, {% getUrl image | resize({ width: 1152, height: 800 }) | webp({ quality: 78 }) %} 1152w" type="image/webp" sizes="100vw">
                    <source media="(max-width: 600px)" srcset="{% getUrl image | resize({ width: 576, height: 400 }) | jpeg({ quality: 82 }) %} 576w, {% getUrl image | resize({ width: 1152, height: 800 }) | jpeg({ quality: 82 }) %} 1152w" type="image/jpeg" sizes="100vw">
                    <!--Tablet Image-->
                    <source media="(max-width: 1024px)" srcset="{% getUrl image | resize({ width: 800, height: 307 }) | avif({ quality: 70 }) %} 800w, {% getUrl image | resize({ width: 1600, height: 614 }) | avif({ quality: 70 }) %} 1600w" type="image/avif" sizes="100vw">
                    <source media="(max-width: 1024px)" srcset="{% getUrl image | resize({ width: 800, height: 307 }) | webp({ quality: 78 }) %} 800w, {% getUrl image | resize({ width: 1600, height: 614 }) | webp({ quality: 78 }) %} 1600w" type="image/webp" sizes="100vw">
                    <source media="(max-width: 1024px)" srcset="{% getUrl image | resize({ width: 800, height: 307 }) | jpeg({ quality: 82 }) %} 800w, {% getUrl image | resize({ width: 1600, height: 614 }) | jpeg({ quality: 82 }) %} 1600w" type="image/jpeg" sizes="100vw">
                    <!--Desktop Image-->
                    <source media="(min-width: 1024px)" srcset="{% getUrl image | resize({ width: 800, height: 400 }) | avif({ quality: 70 }) %} 800w, {% getUrl image | resize({ width: 1600, height: 800 }) | avif({ quality: 70 }) %} 1600w" type="image/avif" sizes="800px">
                    <source media="(min-width: 1024px)" srcset="{% getUrl image | resize({ width: 800, height: 400 }) | webp({ quality: 78 }) %} 800w, {% getUrl image | resize({ width: 1600, height: 800 }) | webp({ quality: 78 }) %} 1600w" type="image/webp" sizes="800px">
                    <source media="(min-width: 1024px)" srcset="{% getUrl image | resize({ width: 800, height: 400 }) | jpeg({ quality: 82 }) %} 800w, {% getUrl image | resize({ width: 1600, height: 800 }) | jpeg({ quality: 82 }) %} 1600w" type="image/jpeg" sizes="800px">
                    <img src="{% getUrl image | resize({ width: 1600, height: 800 }) | jpeg({ quality: 82 }) %}" srcset="{% getUrl image | resize({ width: 800, height: 400 }) | jpeg({ quality: 82 }) %} 800w, {% getUrl image | resize({ width: 1600, height: 800 }) | jpeg({ quality: 82 }) %} 1600w" sizes="800px" alt="{{ alt }}" width="1600" height="800" loading="eager" decoding="async" fetchpriority="high" aria-hidden="true">
                </picture>
                <div class="cs-article-group">
                    <h1 class="cs-article-title">{{ title }}</h1>
                    <div class="cs-author-group">
                        <picture class="cs-author-img">
                            <img src="{% getUrl "/assets/images/doctora-avatar.jpg" | resize({ width: 96, height: 96 }) | jpeg({ quality: 82 }) %}" srcset="{% getUrl "/assets/images/doctora-avatar.jpg" | resize({ width: 48, height: 48 }) | jpeg({ quality: 82 }) %} 48w, {% getUrl "/assets/images/doctora-avatar.jpg" | resize({ width: 96, height: 96 }) | jpeg({ quality: 82 }) %} 96w" sizes="32px" alt="Dra. Cristabel Hernández" width="96" height="96" decoding="async" loading="lazy"/>
                        </picture>
                        <span class="cs-author-name">{{ author }}</span>
                        <span aria-hidden="true" class="cs-dot"></span>
                        <span class="cs-date">{{ date | postDate }}</span>
                    </div>
                </div>
                <section class="cs-article-content">
                    {{ content | safe }}
                </section>
            </article>
        </div>

        {% include 'components/featured-posts.html' %}
    </div>
{% endblock %}
