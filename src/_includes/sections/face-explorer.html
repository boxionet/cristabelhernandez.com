<!-- ============================================ -->
<!--               Face Explorer                  -->
<!-- ============================================ -->

<section id="face-explorer">
    <div class="cs-container">
        <div class="cs-content">
            <span class="cs-topper">Tratamientos faciales</span>
            <h2 class="cs-title">¿Qué tratamiento va en cada zona?</h2>
            <p class="cs-text">Toca un punto del rostro para ver el tratamiento de esa zona.</p>
        </div>
        <div class="face-stage">
            <figure class="face" id="face">
                <picture class="photo photo-mujer">
                    <source media="(max-width: 600px)" data-srcset="{% getUrl "/assets/images/modelo-rostro-mujer.jpg" | resize({ width: 720, height: 900 }) | avif({ quality: 70 }) %}" type="image/avif">
                    <source media="(max-width: 600px)" data-srcset="{% getUrl "/assets/images/modelo-rostro-mujer.jpg" | resize({ width: 720, height: 900 }) | webp({ quality: 78 }) %}" type="image/webp">
                    <source media="(min-width: 601px)" data-srcset="{% getUrl "/assets/images/modelo-rostro-mujer.jpg" | resize({ width: 1120, height: 1400 }) | avif({ quality: 72 }) %}" type="image/avif">
                    <source media="(min-width: 601px)" data-srcset="{% getUrl "/assets/images/modelo-rostro-mujer.jpg" | resize({ width: 1120, height: 1400 }) | webp({ quality: 80 }) %}" type="image/webp">
                    <img data-src="{% getUrl "/assets/images/modelo-rostro-mujer.jpg" | resize({ width: 1120, height: 1400 }) | jpeg({ quality: 82 }) %}" alt="Retrato de una mujer sonriendo sobre un fondo beige" width="1120" height="1400" loading="lazy" decoding="async">
                </picture>
                <picture class="photo photo-hombre" aria-hidden="true">
                    <source media="(max-width: 600px)" data-srcset="{% getUrl "/assets/images/modelo-rostro-hombre.jpg" | resize({ width: 720, height: 900 }) | avif({ quality: 70 }) %}" type="image/avif">
                    <source media="(max-width: 600px)" data-srcset="{% getUrl "/assets/images/modelo-rostro-hombre.jpg" | resize({ width: 720, height: 900 }) | webp({ quality: 78 }) %}" type="image/webp">
                    <source media="(min-width: 601px)" data-srcset="{% getUrl "/assets/images/modelo-rostro-hombre.jpg" | resize({ width: 1120, height: 1400 }) | avif({ quality: 72 }) %}" type="image/avif">
                    <source media="(min-width: 601px)" data-srcset="{% getUrl "/assets/images/modelo-rostro-hombre.jpg" | resize({ width: 1120, height: 1400 }) | webp({ quality: 80 }) %}" type="image/webp">
                    <img data-src="{% getUrl "/assets/images/modelo-rostro-hombre.jpg" | resize({ width: 1120, height: 1400 }) | jpeg({ quality: 82 }) %}" alt="Retrato de un hombre sonriendo sobre un fondo beige" width="1120" height="1400" decoding="async">
                </picture>
                <div class="gender-switch" role="group" aria-label="Cambiar de modelo">
                    <span class="gender-thumb" aria-hidden="true"></span>
                    <button type="button" data-gender="mujer" aria-pressed="true">Mujer</button>
                    <button type="button" data-gender="hombre" aria-pressed="false">Hombre</button>
                </div>
                {% for zone in faceExplorer.zones %}
                <button class="hotspot" type="button" style="left:{{ zone.mujer[0] }}%;top:{{ zone.mujer[1] }}%" data-zone="{{ zone.id }}" data-name="{{ zone.name }}" data-desc="{{ zone.desc }}" data-x-mujer="{{ zone.mujer[0] }}" data-y-mujer="{{ zone.mujer[1] }}" data-x-hombre="{{ zone.hombre[0] }}" data-y-hombre="{{ zone.hombre[1] }}" aria-expanded="false" aria-controls="pop" aria-label="{{ zone.zoneLabel }}: {{ zone.name }}"></button>
                {% endfor %}
                <svg class="wires" id="wires" aria-hidden="true"></svg>
                <div class="pop" id="pop" role="dialog" aria-live="polite"></div>
            </figure>
        </div>
        <p class="more"><a href="/tratamientos-faciales/">Ver todos los tratamientos faciales</a></p>
    </div>
</section>
