<!-- ============================================ -->
<!--                 Call To Action               -->
<!-- ============================================ -->

<section id="cta-2353">
    <div class="cs-container">
        <div class="cs-content">
            <span class="cs-topper">Contáctanos</span>
            <h2 class="cs-title">Tu mejor versión empieza con una cita. Estamos en Puerto Plata para cuidar tu piel.</h2>
            <div class="cs-button-box">
                <a href="tel:{{ client.phoneForTel }}" class="cs-link">
                    <picture class="cs-icon-wrapper">
                        <img class="cs-icon" aria-hidden="true" loading="lazy" decoding="async" src="/assets/svgs/phone.svg" alt="teléfono" width="24" height="24">
                    </picture>
                    <div class="cs-info">
                        <span class="cs-desc">Llámanos o escríbenos</span>
                        <span class="cs-contact">{{ client.phoneFormatted }}</span>
                    </div>
                </a>
                <a href="mailto:{{ client.email }}" class="cs-link">
                    <picture class="cs-icon-wrapper">
                        <img class="cs-icon" aria-hidden="true" loading="lazy" decoding="async" src="/assets/svgs/mail.svg" alt="correo" width="24" height="24">
                    </picture>
                    <div class="cs-info">
                        <span class="cs-desc">Envíanos un correo</span>
                        <span class="cs-contact">{{ client.email }}</span>
                    </div>
                </a>
            </div>
            <a href="/reservar/" class="cs-button-solid">Reserva tu cita</a>
        </div>
        <picture class="cs-picture">
            <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/clinica-recepcion.jpg" | resize({ width: 640, height: 284 }) | avif %}" type="image/avif">
            <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/clinica-recepcion.jpg" | resize({ width: 640, height: 284 }) | webp %}" type="image/webp">
            <source media="(min-width: 601px)" srcset="{% getUrl "/assets/images/clinica-recepcion.jpg" | resize({ width: 1280, height: 568 }) | avif %}" type="image/avif">
            <source media="(min-width: 601px)" srcset="{% getUrl "/assets/images/clinica-recepcion.jpg" | resize({ width: 1280, height: 568 }) | webp %}" type="image/webp">
            <img aria-hidden="true" decoding="async" src="{% getUrl "/assets/images/clinica-recepcion.jpg" | resize({ width: 1280, height: 568 }) | jpeg %}" alt="recepción de la clínica" width="1280" height="568">
        </picture>
    </div>
</section>
